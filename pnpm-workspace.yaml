packages:
  - apps/*
  - packages/*

# One version for every dependency more than one package uses; package.json files
# refer to it as "catalog:". Bump it here, never in a single package.
catalog:
  '@json-render/core': ^0.21.4
  '@json-render/react': ^0.21.4
  'ai': ^7.0.162
  'zod': ^4.6.7
  '@types/node': ^26.6.6
  'typescript': ^7.0.2

# pnpm blocks install scripts by default; esbuild needs its own to fetch its binary.
allowBuilds:
  esbuild: true
