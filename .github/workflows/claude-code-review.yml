name: Claude PR Review (pr-review-toolkit)

on:
  pull_request:
    types: [opened, ready_for_review]   # once per PR; add "synchronize" to review every push

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # needed to post the review comment
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # full history so the toolkit can diff against the base branch

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "pr-review-toolkit@claude-code-plugins"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The base branch is origin/${{ github.base_ref }}; compare HEAD against it.

            Run the /pr-review-toolkit:review-pr skill (use the Skill tool) with the arguments: code errors types tests
            It launches review subagents; let them finish before writing the summary.

            The summary lists issues only: no "Strengths" or "what's good" section, no praise.
            Group issues by severity (critical, important, minor), each with file:line,
            the problem and a suggested fix. If there are no issues, write one line saying so.

            When the review is done, write the final summary to review.md and post it
            as a single PR comment:
            gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
          claude_args: |
            --max-turns 30
            --allowedTools "Skill,Agent,Task,Read,Grep,Glob,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
